<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APEX SOCIETY CLUB Application Form</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #000;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }

    .form-container {
        background: rgba(20, 20, 20, 0.95);
        border: 3px solid red;
        border-radius: 15px;
        padding: 25px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 0 25px rgba(255, 0, 0, 0.7);
    }

    h2, h3, p {
        text-align: center;
        margin-bottom: 15px;
    }

    h2 {
        color: #ff3333;
    }

    label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
        color: #ff9999;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"],
    textarea,
    select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 2px solid red;
        border-radius: 8px;
        background-color: #1a1a1a;
        color: white;
    }

    textarea {
        resize: none;
    }

    .checkbox-group label {
        display: block;
        margin-top: 5px;
        font-weight: normal;
        color: white;
    }

    .submit-btn {
        margin-top: 20px;
        width: 100%;
        background-color: red;
        border: none;
        color: white;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
    }

    .submit-btn:hover {
        background-color: #cc0000;
    }

    .header-note {
        font-size: 14px;
        text-align: center;
        margin-bottom: 20px;
        color: #ffcccc;
    }

    .lang-toggle {
        text-align: center;
        margin-bottom: 15px;
    }

    .lang-toggle button {
        background: red;
        border: none;
        color: white;
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    footer {
        text-align: center;
        font-size: 13px;
        margin-top: 25px;
        color: #999;
    }
</style>
</head>
<body>

<div class="form-container">
    <div class="lang-toggle">
        <button type="button" onclick="toggleLang()">🌐 English / Filipino</button>
    </div>

    <h3 id="greet">HI GOOD MORNING / GOOD AFTERNOON / GOOD NIGHT 🌙</h3>
    <p id="note" class="header-note">
        FILL UP LANG PO PARA MAKA SALI. MAKE SURE NA DI MAKULIT AT BASTOS. THANK YOU!
    </p>

    <h2>APEX SOCIETY CLUB</h2>
    <h3>🎮 APPLICATION FORM 🎮</h3>

    <form id="clubForm">
        <label id="nameLabel">• NAME:</label>
        <input type="text" name="name" required>

        <label id="ageLabel">• AGE:</label>
        <input type="number" name="age" required>

        <label id="genderLabel">• GENDER:</label>
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <label id="cpmIDLabel">• CPM ID:</label>
        <input type="text" name="cpmid" required>

        <label id="ignLabel">• CPM IN-GAME NAME:</label>
        <input type="text" name="ign" required>

        <label id="activeLabel">• ARE YOU ACTIVE IN EVENTS LIKE COLLAB, CAR MEETS, AND COMPETITIONS? (Yes/No):</label>
        <input type="text" name="active" required>

        <label id="lastClanLabel">• NAME OF YOUR LAST CLAN (Leave blank if none):</label>
        <input type="text" name="lastclan">

        <label id="reasonLabel">• WHY DID YOU LEAVE YOUR LAST CLAN? (Leave blank if none):</label>
        <textarea rows="2" name="reason"></textarea>

        <label id="dailyTaskLabel">• DO YOU KNOW HOW TO DO DAILY TASKS? (Yes/No):</label>
        <input type="text" name="dailytask" required>

        <label id="whyJoinLabel">• WHY DO YOU WANT TO JOIN UNDER APEX SOCIETY?</label>
        <textarea rows="3" name="whyjoin" required></textarea>

        <label id="workLabel">• WORKING OR STUDENT?:</label>
        <input type="text" name="work" required>

        <label id="idLabel">• ANY VALID ID (School ID / National ID / etc.):</label>
        <input type="text" name="validid">

        <label id="uploadLabel">• UPLOAD PHOTO:</label>
        <input type="file" id="photo" accept="image/*" required>

        <div class="checkbox-group">
            <label id="skillsLabel">✅ CHECK WHERE YOU ARE SKILLED / ACTIVE:</label>
            <label><input type="checkbox" name="skill" value="Designer"> DESIGNER</label>
            <label><input type="checkbox" name="skill" value="Copier"> COPIER</label>
            <label><input type="checkbox" name="skill" value="Photographer"> PHOTOGRAPHER</label>
            <label><input type="checkbox" name="skill" value="Videographer"> VIDEOGRAPHER</label>
            <label><input type="checkbox" name="skill" value="Editor"> EDITOR</label>
            <label><input type="checkbox" name="skill" value="Recruiter"> RECRUITER</label>
            <label><input type="checkbox" name="skill" value="GG User"> GG USER</label>
            <label><input type="checkbox" name="skill" value="Content Creator"> CONTENT CREATOR</label>
        </div>

        <button type="submit" class="submit-btn">SUBMIT FORM</button>
    </form>

    <footer>© 2025 SupremeModzdev. All Rights Reserved.</footer>
</div>

<script>
// 🔒 Hidden Telegram credentials (di makikita sa page)
const BOT_TOKEN = "8374927169:AAE-6CqX5QFJaA2usw6xjyO7tflb66BpcF8";
const CHAT_ID = "6614066633";

// Filipino / English toggle
let isEnglish = true;
function toggleLang() {
    isEnglish = !isEnglish;
    const t = {
        greet: isEnglish ? "HI GOOD MORNING / GOOD AFTERNOON / GOOD NIGHT 🌙" : "MAGANDANG UMAGA / HAPON / GABI 🌙",
        note: isEnglish ? "HI GOOD MORNING/GOOD NIGHT/GOOD AFTERNOON JUST FILL UP TO JOIN MAKE SURE IT'S NOT MISUSED AND RUDE THANK YOU!" : "PAKI SAGUTAN ANG FORM PARA MAKASALI. SIGURADUHIN NA HINDI MAKULIT O BASTOS. SALAMAT!",
        nameLabel: isEnglish ? "• NAME:" : "• PANGALAN:",
        ageLabel: isEnglish ? "• AGE:" : "• EDAD:",
        genderLabel: isEnglish ? "• GENDER:" : "• KASARIAN:",
        cpmIDLabel: isEnglish ? "• CPM ID:" : "• CPM ID:",
        ignLabel: isEnglish ? "• CPM IN-GAME NAME:" : "• PANGALAN SA LARO:",
        activeLabel: isEnglish ? "• ARE YOU ACTIVE IN EVENTS LIKE COLLAB, CAR MEETS, AND COMPETITIONS? (Yes/No):" : "• AKTIBO KA BA SA MGA EVENT TULAD NG COLLAB, CAR MEETS, AT KOMPETISYON? (Oo/Hindi):",
        lastClanLabel: isEnglish ? "• NAME OF YOUR LAST CLAN (Leave blank if none):" : "• PANGALAN NG HULING CLAN (Iwanan kung wala):",
        reasonLabel: isEnglish ? "• WHY DID YOU LEAVE YOUR LAST CLAN? (Leave blank if none):" : "• BAKIT KA UMANALIS SA HULING CLAN? (Iwanan kung wala):",
        dailyTaskLabel: isEnglish ? "• DO YOU KNOW HOW TO DO DAILY TASKS? (Yes/No):" : "• ALAM MO BA KUNG PAANO GAWIN ANG MGA DAILY TASKS? (Oo/Hindi):",
        whyJoinLabel: isEnglish ? "• WHY DO YOU WANT TO JOIN UNDER SYNDI RACERS?" : "• BAKIT MO GUSTONG SUMALI SA SYNDI RACERS?",
        workLabel: isEnglish ? "• WORKING OR STUDENT?:" : "• NAGTATRABAHO O ESTUDYANTE?:",
        idLabel: isEnglish ? "• ANY VALID ID (School ID / National ID / etc.):" : "• MAY VALID ID BA? (School ID / National ID / etc.):",
        uploadLabel: isEnglish ? "• UPLOAD PHOTO:" : "• MAG-UPLOAD NG LARAWAN:",
        skillsLabel: isEnglish ? "✅ CHECK WHERE YOU ARE SKILLED / ACTIVE:" : "✅ PILIIN KUNG SAAN KA MAGALING / AKTIBO:"
    };
    for (const [id, text] of Object.entries(t)) document.getElementById(id).innerText = text;
}

// Send form to Telegram
document.getElementById("clubForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const photo = document.getElementById("photo").files[0];

    let text = "📋 *APEX SOCIETY CLUB APPLICATION*\n\n";
    new FormData(form).forEach((v, k) => {
        if (k === "skill") text += "• Skill: " + v + "\n";
        else text += `• ${k.toUpperCase()}: ${v}\n`;
    });

    try {
        // Send text message
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: "Markdown" })
        });

        // Send photo (optional)
        if (photo) {
            const fd = new FormData();
            fd.append("chat_id", CHAT_ID);
            fd.append("photo", photo);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: "POST", body: fd });
        }

        alert("✅ Application submitted successfully!");
        form.reset();
    } catch (err) {
        alert("❌ Error sending form. Please try again.");
        console.error(err);
    }
});
</script>

</body>
</html>
